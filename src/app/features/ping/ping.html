<section class="card">
  <h2>Kiểm tra kết nối FE ↔ BE</h2>

  <div class="actions">
    <button type="button" (click)="ping()" [disabled]="loading()">GET /api/demo/ping</button>
  </div>

  <form class="actions" (ngSubmit)="echo()">
    <input name="message" [(ngModel)]="message" placeholder="Nhập nội dung gửi lên BE" />
    <button type="submit" [disabled]="loading()">POST /api/demo/echo</button>
  </form>

  @if (loading()) {
    <p class="status">Đang gọi BE...</p>
  }

  @if (result(); as res) {
    <div class="status success">
      <p><strong>Status:</strong> {{ res.status }}</p>
      <p><strong>Message:</strong> {{ res.message }}</p>
      <p><strong>Server time:</strong> {{ res.serverTime | date: 'dd/MM/yyyy HH:mm:ss' }}</p>
    </div>
  }

  @if (error(); as err) {
    <p class="status error">{{ err }}</p>
  }
</section>
